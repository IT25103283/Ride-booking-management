spring.application.name=RideManagement

# Server port
server.port=8080

# Thymeleaf settings
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# File storage path for rides (relative to working directory)
rides.file.path=data/rides.txt

# App display settings
app.name=AeroRide
app.tagline=Antigravity Flight Booking System
